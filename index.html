<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英語資格試験 模擬テスト（大問1〜4問題集）</title>
    <style>
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }
        h1 {
            font-size: 1.5rem;
            color: #2c3e50;
            text-align: center;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .nav-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #3498db;
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn-active {
            background-color: #2e7d32;
        }
        .card {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .passage-box {
            background: #eef7fc;
            border-left: 4px solid #3498db;
            padding: 15px;
            margin-bottom: 20px;
            white-space: pre-wrap;
            font-family: Georgia, serif;
        }
        .question-text {
            font-weight: bold;
            margin-bottom: 15px;
            white-space: pre-line;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }
        .option-btn {
            background: #fff;
            border: 1px solid #ccc;
            padding: 10px 15px;
            text-align: left;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .option-btn:hover {
            background: #f0f0f0;
            border-color: #999;
        }
        .explanation {
            margin-top: 15px;
            padding: 12px;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .exp-correct {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }
        .exp-wrong {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ef9a9a;
        }
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>英語資格試験 模擬テスト</h1>
    
    <div class="nav-buttons">
        <button class="btn" onclick="loadSection(1)">大問1: 語彙・文法 (20パターン)</button>
        <button class="btn" onclick="loadSection(2)">大問2: 会話文完成 (20パターン)</button>
        <button class="btn" onclick="loadSection(3)">大問3: 案内・メール (5セット)</button>
        <button class="btn" onclick="loadSection(4)">大問4: 長文読解 (5セット)</button>
    </div>

    <div id="content-area"></div>
</div>

<script>
// --- 大問1: 語彙・文法 (20パターン) ---
function generateVocabularyBank() {
    const templates = [
        {
            q: "The company decided to ( ) a new marketing strategy to attract younger customers.",
            options: ["1 adopt", "2 adapt", "3 avoid", "4 afford"],
            ans: 0, exp: "「新しいマーケティング戦略を採用する」という意味になり、1 adopt（採用する）が適切です。"
        },
        {
            q: "Ms. Tanaka gave a very ( ) presentation that persuaded all the board members.",
            options: ["1 convincing", "2 reluctant", "3 careless", "4 convenient"],
            ans: 0, exp: "役員全員を納得させたことから「1 convincing（説得力のある）」が適切です。"
        },
        {
            q: "Due to bad weather, the outdoor concert was ( ) until next weekend.",
            options: ["1 called off", "2 put off", "3 taken off", "4 turned off"],
            ans: 1, exp: "「来週末まで延期された」となるため「2 put off（延期する）」が適切です。（called offは中止）"
        },
        {
            q: "The new software update significantly improved system performance, making it run ( ) faster.",
            options: ["1 highly", "2 considerably", "3 nearly", "4 deeply"],
            ans: 1, exp: "比較級 faster を強調し「かなり速く」とする「2 considerably（かなり、大幅に）」が適切です。"
        },
        {
            q: "All employees are required to show their identification badges at the ( ) to the building.",
            options: ["1 entrance", "2 allowance", "3 substance", "4 distance"],
            ans: 0, exp: "建物の「1 entrance（入口）」が文脈上最も適切です。"
        },
        {
            q: "By the time the manager arrived at the office, the team ( ) the project proposal.",
            options: ["1 finishes", "2 has finished", "3 had finished", "4 will finish"],
            ans: 2, exp: "マネージャーが到着した（過去）時点ですでに完了していたため、過去完了形「3 had finished」になります。"
        },
        {
            q: "The consultant ( ) we hired last month has introduced several efficient methods.",
            options: ["1 who", "2 whose", "3 which", "4 where"],
            ans: 0, exp: "先行詞が「The consultant（人）」であり、目的格の関係代名詞「1 who（またはwhom）」が入ります。"
        },
        {
            q: "If I ( ) more time yesterday, I would have attended the seminar on artificial intelligence.",
            options: ["1 have", "2 had had", "3 will have", "4 have had"],
            ans: 1, exp: "過去の事実と反対の仮定を表す仮定法過去完了（If + 主語 + had + 過去分詞）のため「2 had had」が適切です。"
        },
        {
            q: "Please ( ) all confidential documents before leaving the conference room.",
            options: ["1 secure", "2 damage", "3 publish", "4 ignore"],
            ans: 0, exp: "機密文書を「1 secure（しっかり保管・確保する）」が適切です。"
        },
        {
            q: "The customer service representative offered a full ( ) for the damaged product.",
            options: ["1 receipt", "2 refund", "3 discount", "4 charge"],
            ans: 1, exp: "破損品に対して「2 refund（全額返金）」を提供する文脈が自然です。"
        },
        {
            q: "It is ( ) for all drivers to wear seatbelts while driving.",
            options: ["1 mandatory", "2 optional", "3 flexible", "4 temporary"],
            ans: 0, exp: "シートベルト着用は義務であるため「1 mandatory（義務的な、必須の）」が適当です。"
        },
        {
            q: "The flight was delayed due to heavy fog; ( ), all passengers remained patient.",
            options: ["1 therefore", "2 nevertheless", "3 otherwise", "4 besides"],
            ans: 1, exp: "「濃霧で遅延したが、それにもかかわらず乗客は忍耐強かった」となるため「2 nevertheless（それにもかかわらず）」が適当です。"
        },
        {
            q: "We need to ( ) solutions to reduce operational costs this quarter.",
            options: ["1 come up with", "2 look down on", "3 run out of", "4 catch up with"],
            ans: 0, exp: "解決策を「1 come up with（思いつく・提案する）」が適当です。"
        },
        {
            q: "The survey ( ) by the research firm revealed interesting market trends.",
            options: ["1 conducting", "2 conducted", "3 conduct", "4 to conduct"],
            ans: 1, exp: "「調査会社によって実施された調査」という受動の意味になるため過去分詞「2 conducted」が入ります。"
        },
        {
            q: "The candidate's extensive ( ) in international trade made her the top applicant.",
            options: ["1 experience", "2 experiment", "3 expectation", "4 expression"],
            ans: 0, exp: "「国際貿易における豊富な経験」という意味になり「1 experience」が適当です。"
        },
        {
            q: "The factory has ( ) its production capacity to meet the growing demand.",
            options: ["1 expanded", "2 reduced", "3 postponed", "4 dismissed"],
            ans: 0, exp: "需要増に対応するため「1 expanded（拡大した）」が適当です。"
        },
        {
            q: "This year's sales figures are ( ) higher than those of the previous fiscal year.",
            options: ["1 far", "2 very", "3 more", "4 too"],
            ans: 0, exp: "比較級 higher を強調する語として「1 far（遥かに）」が適当です。（veryは比較級修飾不可）"
        },
        {
            q: "The manager emphasized the importance of maintaining a ( ) work environment.",
            options: ["1 safe", "2 hazardous", "3 severe", "4 critical"],
            ans: 0, exp: "職場の維持として適切なのは「1 safe（安全な）」環境です。"
        },
        {
            q: "The team worked around the clock in order to ( ) the strict deadline.",
            options: ["1 meet", "2 break", "3 pass", "4 lose"],
            ans: 0, exp: "締切を守る・間に合わせる表現は「1 meet the deadline」です。"
        },
        {
            q: "The board members agreed that the proposed budget was ( ) reasonable.",
            options: ["1 perfectly", "2 perfection", "3 perfect", "4 perfecting"],
            ans: 0, exp: "形容詞 reasonable を修飾する副詞「1 perfectly（完全に・実に）」が入ります。"
        }
    ];

    let bank = [];
    for (let i = 1; i <= 50; i++) {
        let t = templates[(i - 1) % templates.length];
        bank.push({
            id: i,
            q: t.q,
            options: t.options,
            ans: t.ans,
            exp: t.exp
        });
    }
    return bank;
}

// --- 大問2: 会話文完成 (20パターン) ---
function generateDialogueBank() {
    const templates = [
        {
            q: "A: Welcome to PC Support. How can I help you today?\nB: My laptop won't connect to Wi-Fi.\nA: I see. Let me ( ) to check the hardware.\nB: Thank you.",
            options: ["1 fix your desk as soon as possible", "2 make sure the screen is dark enough", "3 inspect your wireless adapter", "4 return it to you without repair"],
            ans: 2, exp: "通信ハードウェアを確認するため「3 inspect your wireless adapter」が適当です。"
        },
        {
            q: "A: Do you have a table for two available?\nB: Yes, but you'll have to wait about 15 minutes.\nA: That's fine. Can we ( ) in the meantime?\nB: Sure, right this way.",
            options: ["1 look at the menu", "2 pay the bill", "3 cancel our reservation", "4 wash the dishes"],
            ans: 0, exp: "待ち時間にできることとして「1 look at the menu（メニューを見る）」が適当です。"
        },
        {
            q: "A: How was your weekend trip to the mountains?\nB: It was great, but it started raining heavily on Sunday.\nA: Oh, that's too bad. Did you ( )?\nB: Yes, we visited an art museum instead.",
            options: ["1 go hiking anyway", "2 change your plans", "3 stay home all weekend", "4 buy a new umbrella"],
            ans: 1, exp: "雨のため予定を変更したか尋ねる「2 change your plans」が適当です。"
        },
        {
            q: "A: Good morning, Marketing Department.\nB: Hello, may I speak to Mr. Davis, please?\nA: I'm afraid he is in a meeting right now. Would you like to ( )?\nB: Yes, please ask him to call me back.",
            options: ["1 join the meeting", "2 leave a message", "3 wait on the line forever", "4 send him a postcard"],
            ans: 1, exp: "不在時の対応として「2 leave a message（伝言を残す）」が適当です。"
        },
        {
            q: "A: Excuse me, I really like this jacket. Do you have it in a medium?\nB: Let me check our stock room... Yes, here you go.\nA: Great! Where can I ( )?\nB: The fitting rooms are right over there.",
            options: ["1 try it on", "2 return this item", "3 pay for shipping", "4 wash this jacket"],
            ans: 0, exp: "試着室の場所を聞く文脈なので「1 try it on（試着する）」が適当です。"
        },
        {
            q: "A: Hi, I'd like to check in, but I know it's only 11 AM.\nB: Standard check-in is at 3 PM, sir.\nA: Is it possible to ( ) until then?\nB: Certainly. We can store them in our luggage room.",
            options: ["1 book another room", "2 leave my bags here", "3 get a full refund", "4 order room service"],
            ans: 1, exp: "チェックイン前荷物を預ける「2 leave my bags here」が適当です。"
        },
        {
            q: "A: Excuse me, could you tell me how to get to the central library?\nB: Go straight down this street and turn left at the traffic light.\nA: Is it ( ) from here?\nB: No, it's only about a 5-minute walk.",
            options: ["1 open today", "2 very far", "3 expensive to enter", "4 dangerous to walk"],
            ans: 1, exp: "徒歩5分かを聞く前の質問として「2 very far（とても遠いですか）」が適当です。"
        },
        {
            q: "A: Dr. Smith's office. How can I help you?\nB: I'd like to ( ) for a routine checkup.\nA: Sure, we have openings this Thursday at 2 PM.",
            options: ["1 make an appointment", "2 cancel my insurance", "3 pay my medical bill", "4 take some medicine"],
            ans: 0, exp: "受診の予約をする表現「1 make an appointment」が適当です。"
        },
        {
            q: "A: Please put your suitcase on the scale.\nB: Here you go. Is the weight okay?\nA: I'm sorry, but it's 3 kilograms over the limit. You will need to ( ).\nB: Oh, then I'll move some heavy items to my carry-on.",
            options: ["1 buy a new suitcase", "2 pay an extra fee", "3 change your flight seat", "4 leave the airport"],
            ans: 1, exp: "重量オーバー時の対応として「2 pay an extra fee（追加料金を払う）」が適当です。"
        },
        {
            q: "A: What can I get for you today?\nB: An iced latte and a blueberry muffin, please.\nA: Will that be for here or ( )?\nB: To go, please.",
            options: ["1 for later", "2 to take out", "3 to go", "4 for dining"],
            ans: 2, exp: "店内か持ち帰りか尋ねる定型句「3 to go（お持ち帰り）」が適当です。"
        },
        {
            q: "A: Are you free to grab some lunch now?\nB: I'd love to, but I have to ( ) by 1 PM.\nA: That's okay, we can go somewhere quick nearby.",
            options: ["1 finish this report", "2 start my vacation", "3 buy a new car", "4 clean my house"],
            ans: 0, exp: "仕事中の昼休みの会話として「1 finish this report（レポートを終わらせる）」が適当です。"
        },
        {
            q: "A: You look stressed. What happened?\nB: The train was delayed by 30 minutes due to heavy snow.\nA: Oh no. Did you ( ) for your job interview?\nB: Luckily, I arrived just in time.",
            options: ["1 make it on time", "2 forget your resume", "3 miss the train", "4 cancel the meeting"],
            ans: 0, exp: "「ギリギリ間に合った」という返答に繋がる「1 make it on time（時間通りに着く）」が適当です。"
        },
        {
            q: "A: I'm going to the supermarket. Do we need anything?\nB: We're almost out of milk and eggs. Could you ( )?\nA: No problem. Anything else?",
            options: ["1 cook dinner now", "2 pick some up", "3 throw them away", "4 bake a cake"],
            ans: 1, exp: "日用品を買ってくるよう頼む「2 pick some up（いくつか買ってきて）」が適当です。"
        },
        {
            q: "A: Two tickets for the 7:00 PM show of 'Space Adventure', please.\nB: All seats in the middle are taken. Would you mind ( )?\nA: That's fine. We just want to see the movie.",
            options: ["1 sitting in the front row", "2 paying in cash", "3 coming back tomorrow", "4 watching a different movie"],
            ans: 0, exp: "中央席が埋まっているため提案される「1 sitting in the front row（最前列に座る）」が適当です。"
        },
        {
            q: "A: I'd like to renew this book for another two weeks.\nB: Let me check... I'm sorry, but another user has ( ).\nA: Ah, I see. Then I'll return it today.",
            options: ["1 read this book already", "2 reserved it", "3 lost the book", "4 written a review"],
            ans: 1, exp: "延長できない理由として「2 reserved it（予約している）」が適当です。"
        },
        {
            q: "A: Are you coming to Sarah's birthday party this Saturday?\nB: I really want to, but I ( ) on that day.\nA: That's a shame! She will miss you.",
            options: ["1 have a prior engagement", "2 don't like parties", "3 forgot her birthday", "4 live too close"],
            ans: 0, exp: "行けない理由として「1 have a prior engagement（先約がある）」が適当です。"
        },
        {
            q: "A: Good afternoon. I'd like to open a new savings account.\nB: Sure thing. Do you have ( ) with you today?\nA: Yes, I have my driver's license and passport.",
            options: ["1 a credit card", "2 official identification", "3 a job application", "4 a checkbook"],
            ans: 1, exp: "本人確認書類を指す「2 official identification」が適当です。"
        },
        {
            q: "A: It looks like it's going to freeze tonight.\nB: Really? Maybe I should ( ) before going out.\nA: Definitely. It's much colder than yesterday.",
            options: ["1 wear a heavy coat", "2 turn off the heater", "3 drink iced tea", "4 open all the windows"],
            ans: 0, exp: "極寒の予想に対する服装として「1 wear a heavy coat（厚手のコートを着る）」が適当です。"
        },
        {
            q: "A: I'm looking for a gift for my mother's 60th birthday.\nB: How about a silk scarf? They are very popular.\nA: That sounds lovely. Can you ( )?\nB: Of course, we offer free gift wrapping.",
            options: ["1 wrap it for me", "2 wear it now", "3 send it to me", "4 lower the price"],
            ans: 0, exp: "プレゼント用に頼む「1 wrap it for me（ラッピングしてもらう）」が適当です。"
        },
        {
            q: "A: I'm thinking about joining this gym to get in shape.\nB: Great! We offer a free trial class for new members.\nA: That sounds good. Can I ( ) for tomorrow's class?\nB: Sure, let me take your name and email.",
            options: ["1 sign up", "2 give up", "3 pay cash", "4 teach the class"],
            ans: 0, exp: "体験クラスに申し込む表現「1 sign up（申し込む）」が適当です。"
        }
    ];

    let bank = [];
    for (let i = 1; i <= 50; i++) {
        let t = templates[(i - 1) % templates.length];
        bank.push({
            id: i,
            q: t.q,
            options: t.options,
            ans: t.ans,
            exp: t.exp
        });
    }
    return bank;
}

// --- 大問3: 短〜中長文・案内/メール (5セット) ---
function generateReadingPart1Bank() {
    return [
        {
            title: "Passage 1: Office Maintenance Notice",
            text: "To All Employees,\nPlease be advised that the main server will undergo scheduled maintenance this Saturday, October 10th, from 1:00 PM to 5:00 PM. During this period, internal email and cloud storage services will be temporarily unavailable. Please make sure to save all active files and log out of the system before 12:50 PM on Saturday. If you have any urgent inquiries during the downtime, please contact the IT Helpdesk via the emergency mobile line.\nThank you for your cooperation.\nIT Department",
            questions: [
                {
                    q: "Q1. What is the main purpose of this notice?",
                    options: ["1 To announce a company holiday", "2 To inform staff of a temporary system outage", "3 To introduce new IT department members", "4 To update the emergency phone list"],
                    ans: 1, exp: "本文前半でサーバの定期メンテナンスに伴うメール・クラウドの停止（system outage）を知らせています。"
                },
                {
                    q: "Q2. What are employees required to do before 12:50 PM on Saturday?",
                    options: ["1 Call the emergency line", "2 Save files and log out", "3 Clean their workstations", "4 Send an email to the IT department"],

        },
        {

                {

// --- 大問4: 長文読解・説明文/コラム (5セット) ---
function generateReadingPart2Bank() {
    return [

// --- 画面表示制御ロジック ---
let currentSection = 1;
let currentIndex = 0;
let currentBank = [];

function loadSection(sectionNum) {
    currentSection = sectionNum;
    currentIndex = 0;
    
    if (sectionNum === 1) currentBank = generateVocabularyBank();
    else if (sectionNum === 2) currentBank = generateDialogueBank();
    else if (sectionNum === 3) currentBank = generateReadingPart1Bank();
    else if (sectionNum === 4) currentBank = generateReadingPart2Bank();

    render();
}

function render() {
    const area = document.getElementById("content-area");
    const item = currentBank[currentIndex];
    
    // UIボタンの活性表示切り替え
    document.querySelectorAll('.nav-buttons .btn').forEach((btn, idx) => {
        if (idx + 1 === currentSection) btn.classList.add('btn-active');
        else btn.classList.remove('btn-active');
    });

    let html = "";
    
    if (currentSection === 1 || currentSection === 2) {
        // 短文・語彙 / 会話文問題
        html += `<div class="card">
            <div style="font-size:0.85rem; color:#777; margin-bottom:8px;">No. ${item.id} / ${currentBank.length}</div>
            <div class="question-text">${item.q}</div>
            <div class="options">
                ${item.options.map((opt, idx) => `
                    <button class="option-btn" onclick="checkAnswer(${idx},${item.ans}, '${escapeHtml(item.exp)}')">${opt}</button>
                `).join('')}
            </div>
            <div id="result-box"></div>
        </div>`;
    } else {
        // 長文読解問題 (大問3 & 大問4)
        html += `<div class="card">
            <div style="font-size:0.85rem; color:#777; margin-bottom:8px;">Set ${item.id} / ${currentBank.length}</div>
            <h3 style="margin-top:0; color:#2c3e50;">${item.title}</h3>
            <div class="passage-box">${item.text}</div>
            
            ${item.questions.map((qObj, qIdx) => `
                <div style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed #ccc;">
                    <div class="question-text">${qObj.q}</div>
                    <div class="options">
                        ${qObj.options.map((opt, oIdx) => `
                            <button class="option-btn" onclick="checkReadingAnswer('${qIdx}', ${oIdx}, ${qObj.ans}, '${escapeHtml(qObj.exp)}')">${opt}</button>
                        `).join('')}
                    </div>
                    <div id="result-box-${qIdx}"></div>
                </div>
            `).join('')}
        </div>`;
    }

    // ページネーションコントロール
    html += `<div class="pagination">
        <button class="btn" onclick="prevItem()" ${currentIndex === 0 ? 'disabled style="opacity:0.5;cursor:default;"' : ''}>← 前へ</button>
        <span>${currentIndex + 1} / ${currentBank.length}</span>
        <button class="btn" onclick="nextItem()" ${currentIndex === currentBank.length - 1 ? 'disabled style="opacity:0.5;cursor:default;"' : ''}>次へ →</button>
    </div>`;

    area.innerHTML = html;
}

function checkAnswer(selectedIdx, correctIdx, expText) {
    const box = document.getElementById("result-box");
    if (selectedIdx === correctIdx) {
        box.innerHTML = `<div class="explanation exp-correct"><strong>正解です！</strong><br>${expText}</div>`;
    } else {
        box.innerHTML = `<div class="explanation exp-wrong"><strong>不正解です。</strong><br>${expText}</div>`;
    }
}

function checkReadingAnswer(qIdx, selectedIdx, correctIdx, expText) {
    const box = document.getElementById(`result-box-${qIdx}`);
    if (selectedIdx === correctIdx) {
        box.innerHTML = `<div class="explanation exp-correct"><strong>正解です！</strong><br>${expText}</div>`;
    } else {
        box.innerHTML = `<div class="explanation exp-wrong"><strong>不正解です。</strong><br>${expText}</div>`;
    }
}

function prevItem() {
    if (currentIndex > 0) {
        currentIndex--;
        render();
    }
}

function nextItem() {
    if (currentIndex < currentBank.length - 1) {
        currentIndex++;
        render();
    }
}

function escapeHtml(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, "&quot;");
}

// 初期表示（大問1を読み込み）
window.onload = function() {
    loadSection(1);
};
</script>
