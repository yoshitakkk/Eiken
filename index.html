<script>
// --- データベース自動生成 ---
function generateWordBank() {
    const templates = [
        ["nervously", "absolutely", "rarely", "separately", 1, "「絶対に/完全に」を意味する副詞 absolutely が入ります。"],
        ["transferred", "reduced", "proposed", "apologized", 0, "「転勤した/移動した」を意味する transferred が適当です。"],
        ["wooden", "boring", "cute", "reasonable", 3, "「（価格が）手頃な・妥当な」を意味する reasonable が入ります。"],
        ["award", "aisle", "attempt", "announcement", 3, "「お知らせ・発表」を意味する announcement が正解です。"],
        ["battery", "receipt", "website", "frame", 1, "「領収書・レシート」を意味する receipt が入ります。"]
    ];
    let bank = [];
    for (let i = 1; i <= 100; i++) {
        let t = templates[(i - 1) % templates.length];
        bank.push({
            type: "single",
            id: "w" + i,
            q: `[単語 No.${i}] The manager decided that the new guidelines are ( ) necessary for the project's success.`,
            options: [`1 ${t[0]}`, `2 ${t[1]}`, `3 ${t[2]}`, `4 ${t[3]}`],
            answer: t[4],
            explanation: t[5]
        });
    }
    return bank;
}

function generateIdiomBank() {
    const templates = [
        ["next to", "except for", "across from", "up to", 1, "「〜を除いて」を意味する except for が入ります。"],
        ["Get on", "Take off", "Give up", "Look out", 3, "「気をつけて！」を意味する Look out が入ります。"],
        ["out of the question", "up in the air", "in a good temper", "none of your business", 0, "「論外だ・不可能だ」を意味する out of the question が入ります。"]
    ];
    let bank = [];
    for (let i = 1; i <= 100; i++) {
        let t = templates[(i - 1) % templates.length];
        bank.push({
            type: "single",
            id: "i" + i,
            q: `[熟語 No.${i}] All members arrived on time ( ) John, who was delayed by traffic.`,
            options: [`1 ${t[0]}`, `2 ${t[1]}`, `3 ${t[2]}`, `4 ${t[3]}`],
            answer: t[4],
            explanation: t[5]
        });
    }
    return bank;
}

function generateDialogueBank() {
    const templates = [
        {
            q: "A: Welcome to PC Support. How can I help you today?\nB: My laptop won't connect to Wi-Fi.\nA: I see. Let me ( ) to check the hardware.\nB: Thank you.",

            ans: 2, exp: "通信ハードウェアを確認するため「3 inspect your wireless adapter」が適当です。"
        },
        {
            q: "A: How should we travel to the museum?\nB: We can take either the express bus or the train.\nA: Traffic looks heavy right now.\nB: In that case, ( ). It's much faster.",
            options: ["1 we should take the train", "2 we can walk to our hotel", "3 let's book a guided tour later", "4 let's check in our baggage first"],
            ans: 0, exp: "渋滞を避けるため「1 we should take the train」が適当です。"
        }
    ];
    let bank = [];
    for (let i = 1; i <= 100; i++) {
        let t = templates[(i - 1) % templates.length];
        bank.push({
            type: "single",

            q: `[会話問題 No.${i}]\n${t.q}`,

}

// 大問3（長文空所補充 30長文）
function generatePassageBank() {
    const baseTopics = [
        { name: "Old Friends", subject: "reconnecting with childhood friends", location: "hometown", result: "had a great time together", con: "While she was there" },
        { name: "City Gardening", subject: "growing vegetables on balconies", location: "urban areas", result: "build stronger relationships", con: "In addition" },
        { name: "Public Libraries", subject: "offering free digital classes", location: "local communities", result: "learn useful new skills", con: "For example" },
        { name: "School Uniforms", subject: "saving morning preparation time", location: "high schools", result: "focus more on studying", con: "As a result" },
        { name: "Eco-Friendly Shopping", subject: "using reusable shopping bags", location: "supermarkets", result: "reduce plastic waste", con: "Therefore" },
        { name: "Morning Exercise", subject: "walking before starting work", location: "city parks", result: "stay energetic all day", con: "At first" }
    ];

    let bank = [];
    for (let i = 1; i <= 30; i++) {
        let topic = baseTopics[(i - 1) % baseTopics.length];
        let pNum = Math.floor((i - 1) / baseTopics.length) + 1;
        
        bank.push({
            type: "passage",
            id: "p" + i,
            title: `${topic.name} (Part ${pNum})`,
            text: `Many people in modern society are showing interest in ${topic.subject}. In many ${topic.location}, this trend has become very popular among local residents. (  21  ), people discovered that small changes in daily routine could lead to meaningful results.\n\nWorking on this together brought unexpected benefits. People reported that they could (  22  ) through these activities. Overall, experts believe that continuing this habit will greatly improve community life in the future.`,
            subs: [
                {
                    label: "(21)",
                    options: [`1 ${topic.con}`, "2 On the other hand", "3 In contrast", "4 By mistake"],
                    ans: 0,
                    exp: `文脈の流れに最もふさわしい接続詞・表現は「1 ${topic.con}」です。`
                },
                {
                    label: "(22)",
                    options: [`1 ${topic.result}`, "2 lose their interest easily", "3 waste a lot of money", "4 complain about daily work"],
                    ans: 0,
                    exp: `文脈上ポジティブな結果を表す「1 ${topic.result}」が正解となります。`
                }
            ]
        });
    }
    return bank;
}

const q4Bank = generateQ4PassageBank(); // 大問4用20長文

function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function shuffleOptions(question) {
    if (question.type === "passage" || question.type === "email_passage") {
        const newSubs = question.subs.map(sub => {
            const originalAnsText = sub.options[sub.ans];
            const shuffled = shuffleArray(sub.options);
            const clean = shuffled.map(o => o.replace(/^[1-4]\s*/, ""));
            const finalOptions = clean.map((o, idx) => `${idx + 1} ${o}`);
            const newAns = clean.findIndex(o => originalAnsText.includes(o));
            return { ...sub, options: finalOptions, ans: newAns };
        });
        return { ...question, subs: newSubs };
    } else {
        const originalAnswerText = question.options[question.answer];
        const shuffledOptions = shuffleArray(question.options);
        const cleanOptions = shuffledOptions.map(opt => opt.replace(/^[1-4]\s*/, ""));
        const finalOptions = cleanOptions.map((opt, idx) => `${idx + 1} ${opt}`);
        const newAnswerIndex = cleanOptions.findIndex(opt => originalAnswerText.includes(opt));
        return { ...question, options: finalOptions, answer: newAnswerIndex };
    }
}

function getWeakList() {
    const data = localStorage.getItem("eiken_p2_weak_list");
    return data ? JSON.parse(data) : [];
}

function saveWeakList(list) {
    localStorage.setItem("eiken_p2_weak_list", JSON.stringify(list));
    updateWeakCountUI();
}

function updateWeakCountUI() {
    const weakList = getWeakList();
    document.getElementById("weak-count").textContent = weakList.length;
    document.getElementById("weak-mode-btn").disabled = weakList.length === 0;
}

let activeQuestions = [];
let currentIndex = 0;
let userAnswers = {};

function startQuiz(mode) {
    if (mode === "q1") {
        const wSel = shuffleArray(wordBank).slice(0, 8);
        const iSel = shuffleArray(idiomBank).slice(0, 7);
        activeQuestions = shuffleArray([...wSel, ...iSel]).map(shuffleOptions);
    } else if (mode === "q2") {
        activeQuestions = shuffleArray(q2Bank).slice(0, 5).map(shuffleOptions);
    } else if (mode === "q3") {
        activeQuestions = shuffleArray(q3Bank).slice(0, 2).map(shuffleOptions);
    } else if (mode === "q4") {
        // 大問4: 毎回ランダムで2問抽出
        activeQuestions = shuffleArray(q4Bank).slice(0, 2).map(shuffleOptions);
    } else if (mode === "mix") {
        const wSel = shuffleArray(wordBank).slice(0, 8);
        const iSel = shuffleArray(idiomBank).slice(0, 7);
        const q1Sel = shuffleArray([...wSel, ...iSel]);
        const q2Sel = shuffleArray(q2Bank).slice(0, 5);
        activeQuestions = [...q1Sel, ...q2Sel].map(shuffleOptions);
    } else if (mode === "weak") {
        const allQuestions = [...q1Bank, ...q2Bank, ...q3Bank, ...q4Bank];
        const weakIds = getWeakList();
        const weakQuestions = allQuestions.filter(q => weakIds.includes(q.id));
        activeQuestions = shuffleArray(weakQuestions).slice(0, 15).map(shuffleOptions);
    }

    userAnswers = {};
    currentIndex = 0;

    document.getElementById("start-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    document.getElementById("result-area").style.display = "none";
    renderQuestion();
}

function renderQuestion() {
    const qData = activeQuestions[currentIndex];
    const quizArea = document.getElementById("quiz-area");

    if (qData.type === "email_passage") {
        // 大問4 (Eメール形式長文)
        let currentAnswers = userAnswers[currentIndex] || {};
        let subsHtml = qData.subs.map((sub, sIdx) => {
            const selectedOpt = currentAnswers[sIdx];
            let opts = sub.options.map((opt, oIdx) => {
                const isSelected = selectedOpt === oIdx ? "selected" : "";
                return `<button class="option-btn ${isSelected}" onclick="selectSubOption(${sIdx}, ${oIdx})">${opt}</button>`;
            }).join("");

            return `
                <div class="sub-q-box">
                    <div class="sub-q-title">設問 ${sub.label}</div>
                    <div style="font-weight:bold; margin-bottom: 8px; font-size: 0.9rem;">${sub.qText}</div>
                    <div class="options">${opts}</div>
                </div>
            `;
        }).join("");

        quizArea.innerHTML = `
            <div class="question-card">
                <div class="question-number">
                    <span>長文 (${currentIndex + 1} / ${activeQuestions.length})</span>
                    <span class="badge" style="background-color: #16a085">大問4 (内容一致)</span>
                </div>
                <div class="email-header">
                    From: ${qData.from}<br>
                    To: ${qData.to}<br>
                    Date: ${qData.date}<br>
                    Subject: ${qData.subject}
                </div>
                <div class="question-text">${qData.body}</div>
                ${subsHtml}
            </div>
        `;
    } else if (qData.type === "passage") {
        // 大問3
        let currentAnswers = userAnswers[currentIndex] || {};
        let subsHtml = qData.subs.map((sub, sIdx) => {
            const selectedOpt = currentAnswers[sIdx];
            let opts = sub.options.map((opt, oIdx) => {
                const isSelected = selectedOpt === oIdx ? "selected" : "";
                return `<button class="option-btn ${isSelected}" onclick="selectSubOption(${sIdx}, ${oIdx})">${opt}</button>`;
            }).join("");

            return `
                <div class="sub-q-box">
                    <div class="sub-q-title">設問 ${sub.label}</div>
                    <div class="options">${opts}</div>
                </div>
            `;
        }).join("");

        quizArea.innerHTML = `
            <div class="question-card">
                <div class="question-number">
                    <span>長文 (${currentIndex + 1} / ${activeQuestions.length})</span>
                    <span class="badge" style="background-color: #e74c3c">大問3 (長文空所)</span>
                </div>
                <div class="passage-title">${qData.title}</div>
                <div class="question-text">${qData.text}</div>
                ${subsHtml}
            </div>
        `;
    } else {
        // 大問1・2
        let selectedOpt = userAnswers[currentIndex];
        let optionsHtml = qData.options.map((opt, idx) => {
            const isSelected = selectedOpt === idx ? "selected" : "";
            return `<button class="option-btn ${isSelected}" onclick="selectOption(${idx})">${opt}</button>`;
        }).join("");

        let badgeText = qData.id.startsWith("d") ? "大問2 (会話文)" : "大問1 (語彙・熟語)";
        let badgeColor = qData.id.startsWith("d") ? "#9b59b6" : "#3498db";

        quizArea.innerHTML = `
            <div class="question-card">
                <div class="question-number">
                    <span>問題 (${currentIndex + 1} / ${activeQuestions.length})</span>
                    <span class="badge" style="background-color: ${badgeColor}">${badgeText}</span>
                </div>
                <div class="question-text">${qData.q}</div>
                <div class="options">${optionsHtml}</div>
            </div>
        `;
    }

    document.getElementById("prev-btn").disabled = currentIndex === 0;
    if (currentIndex === activeQuestions.length - 1) {
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("submit-btn").style.display = "inline-block";
    } else {
        document.getElementById("next-btn").style.display = "inline-block";
        document.getElementById("submit-btn").style.display = "none";
    }
}

function selectOption(index) {
    userAnswers[currentIndex] = index;
    renderQuestion();
}

function selectSubOption(sIdx, oIdx) {
    if (!userAnswers[currentIndex]) userAnswers[currentIndex] = {};
    userAnswers[currentIndex][sIdx] = oIdx;
    renderQuestion();
}

function changeQuestion(step) {
    currentIndex += step;
    renderQuestion();
}

function showResults() {
    let totalScore = 0;
    let totalMax = 0;
    let detailHtml = "";
    let weakList = getWeakList();

    activeQuestions.forEach((q, idx) => {
        if (q.type === "passage" || q.type === "email_passage") {
            const userSubAns = userAnswers[idx] || {};
            let isAllCorrect = true;
            let sectionName = q.type === "email_passage" ? "大問4" : "大问3";
            let qTitle = q.subject || q.title;

            detailHtml += `<div style="text-align:left; margin-bottom:15px; border-bottom: 2px solid #ddd; padding-bottom:10px;">
                <strong>長文${idx + 1} [${sectionName}: ${qTitle}]:</strong><br>`;

            q.subs.forEach((sub, sIdx) => {
                totalMax++;
                const uAns = userSubAns[sIdx];
                const isCorrect = uAns === sub.ans;
                if (isCorrect) {
                    totalScore++;
                } else {
                    isAllCorrect = false;
                }

                detailHtml += `
                    <div style="margin-left: 10px; margin-top: 5px;">
                        ${sub.label}: ${isCorrect ? '<span class="correct">正解 ◯</span>' : '<span class="incorrect">不正解 ✕</span>'}<br>
                        正解: ${sub.options[sub.ans]}<br>
                        <small style="color:#666;">解説: ${sub.exp}</small>
                    </div>
                `;
            });

            if (isAllCorrect) {
                weakList = weakList.filter(id => id !== q.id);
            } else {
                if (!weakList.includes(q.id)) weakList.push(q.id);
            }

            detailHtml += `</div>`;
        } else {
            totalMax++;
            const userAns = userAnswers[idx];
            const isCorrect = userAns === q.answer;
            
            if (isCorrect) {
                totalScore++;
                weakList = weakList.filter(id => id !== q.id);
            } else {
                if (!weakList.includes(q.id)) weakList.push(q.id);
            }

            let badgeText = q.id.startsWith("d") ? "大問2" : "大問1";

            detailHtml += `
                <div style="text-align:left; margin-bottom:12px; border-bottom: 1px dashed #ccc; padding-bottom:8px;">
                    <strong>問${idx + 1} [${badgeText}]:</strong> ${isCorrect ? '<span class="correct">正解 ◯</span>' : '<span class="incorrect">不正解 ✕</span>'}<br>
                    正解: ${q.options[q.answer]}<br>
                    <small style="color:#666;">解説: ${q.explanation}</small>
                </div>
            `;
        }
    });

    saveWeakList(weakList);

    const resultArea = document.getElementById("result-area");
    resultArea.style.display = "block";
    resultArea.innerHTML = `
        <h2>結果発表</h2>
        <p style="font-size: 1.2rem;">スコア: <strong>${totalScore} / ${totalMax}</strong> 点</p>
        <hr>
        ${detailHtml}
        <button class="btn" style="margin-top:15px;" onclick="returnToStart()">トップに戻る</button>
    `;

    document.getElementById("quiz-screen").style.display = "none";
}

function returnToStart() {
    document.getElementById("start-screen").style.display = "block";
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-area").style.display = "none";
    updateWeakCountUI();
}

updateWeakCountUI();
</script>

</body>
</html>
