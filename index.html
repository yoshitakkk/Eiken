<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英検準2級 対策アプリ</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --success: #16a34a;
      --error: #dc2626;
      --warning: #d97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      line-height: 1.6;
      padding: 20px 10px;
    }

    .container { max-width: 800px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 20px; }
    h1 { font-size: 1.8rem; color: var(--primary); margin-bottom: 8px; }

    nav {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .nav-btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .nav-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    .stats { font-size: 0.95rem; font-weight: bold; }

    .action-btns { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn {
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-secondary { background: #64748b; color: white; }
    .btn-secondary:hover { background: #475569; }
    .btn-warning { background: var(--warning); color: white; }
    .btn-warning:hover { background: #b45309; }
    .btn-danger { background: var(--error); color: white; }
    .btn-danger:hover { background: #b91c1c; }

    .passage-box {
      background: #f1f5f9;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 0.95rem;
      white-space: pre-line;
      border-left: 4px solid var(--primary);
    }

    .question-item {
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .question-header {
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      color: white;
    }
    .badge-correct { background: var(--success); }
    .badge-incorrect { background: var(--error); }
    .badge-tag { background: #6366f1; }

    .question-text {
      font-size: 1.05rem;
      margin-bottom: 12px;
      white-space: pre-line;
    }

    .options {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .option-btn {
      text-align: left;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f8fafc;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .option-btn:hover:not(:disabled) { background: #e2e8f0; }

    .option-btn.selected-correct {
      background: #dcfce7;
      border-color: var(--success);
      color: var(--success);
      font-weight: bold;
    }

    .option-btn.selected-incorrect {
      background: #fee2e2;
      border-color: var(--error);
      color: var(--error);
      font-weight: bold;
    }

    .explanation {
      margin-top: 10px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
    }

    .explanation.show { display: block; }

    .mode-badge {
      display: inline-block;
      padding: 4px 8px;
      background: #e0e7ff;
      color: #3730a3;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>英検準2級 対策アプリ</h1>
  </header>

  <nav id="nav">
    <button class="nav-btn active" onclick="switchSection('part1')">大問1: 語彙 (15問抽選)</button>
    <button class="nav-btn" onclick="switchSection('part2')">大問2: 会話文 (ランダム5問)</button>
    <button class="nav-btn" onclick="switchSection('part3')">大問3: 長文語句補充 (50題からランダム2題)</button>
    <button class="nav-btn" onclick="switchSection('part4')">大問4: 長文読解 (50題からランダム2題)</button>
  </nav>

  <main class="card">
    <div class="controls-bar">
      <div>
        <span id="mode-indicator" class="mode-badge">通常モード</span>
        <div class="stats" id="stats-display">正答率: -% (0/0)</div>
      </div>
      <div class="action-btns">
        <button class="btn btn-secondary" onclick="shuffleCurrentSection()">再シャッフル・出題</button>
        <button class="btn btn-warning" id="review-btn" onclick="toggleReviewMode()">復習モード</button>
        <button class="btn btn-danger" onclick="resetSectionData()">成績リセット</button>
      </div>
    </div>

    <div id="questions-container"></div>
  </main>
</div>

const generatePart2Data = () => {
  const list = [];
  const templates = [
    { q: "A: May I help you?\nB: Yes, I am ( ) a gift for my friend.", opts: ["looking for", "taking off", "turning on", "giving up"], ans: 0, exp: "look for（〜を探す）が適切。" },
    { q: "A: Excuse me, where is the library?\nB: Go straight for two blocks and ( ) right.", opts: ["turn", "pass", "run", "climb"], ans: 0, exp: "turn right（右に曲がる）が適切です。" },
    { q: "A: Why were you late for school today?\nB: Because I ( ) the bus.", opts: ["missed", "dropped", "lost", "forgot"], ans: 0, exp: "miss the bus（バスに乗り遅れる）が適切です。" },
    { q: "A: What time shall we meet tomorrow?\nB: How ( ) 10:00 AM at the cafe?", opts: ["about", "often", "long", "far"], ans: 0, exp: "How about 〜?（〜はどうですか？）が提案の決まり文句です。" },
    { q: "A: Hello, may I speak to Mr. Smith?\nB: Hold ( ), please. I will get him.", opts: ["on", "in", "up", "at"], ans: 0, exp: "Hold on（電話を切らずにお待ちください）が適切です。" }
  ];
  let idCount = 1;
  while (list.length < 50) {
    const base = templates[(idCount - 1) % templates.length];
    list.push({
      id: `p2_${idCount}`,
      question: `(${idCount}) ${base.q}`,
      options: [...base.opts],
      answer: base.ans,
      explanation: base.exp
    });
    idCount++;
  }
  return list;
};

const rawData = {

// --- アプリ状態 ---
let currentSection = 'part1';
let isReviewMode = false;
let displayQuestions = [];

const STORAGE_KEY = 'eiken_prep_history_v3';

function loadHistory() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : {};
  } catch (e) {
    return {};
  }
}

function saveHistory(history) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  } catch (e) {}
}

// ランダム抽出関数
function getRandomItems(array, count) {
  const shuffled = [...array];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled.slice(0, count);
}

// 選択肢シャッフル処理（安全版）
function shuffleOptions(question) {
  const correctText = question.options[question.answer];
  const shuffledOptions = getRandomItems(question.options, question.options.length);
  const newAnswerIndex = shuffledOptions.indexOf(correctText);

  return {
    ...question,
    options: shuffledOptions,
    answer: newAnswerIndex !== -1 ? newAnswerIndex : 0
  };
}

function switchSection(sectionKey) {
  currentSection = sectionKey;
  isReviewMode = false;

  const navBtns = document.querySelectorAll('.nav-btn');
  const keys = ['part1', 'part2', 'part3', 'part4'];
  navBtns.forEach((btn, idx) => {
    btn.classList.toggle('active', keys[idx] === sectionKey);
  });

  loadSectionQuestions(true);
}

function loadSectionQuestions(shouldShuffle = true) {
  const history = loadHistory();

  if (currentSection === 'part1') {
    let selectedWords = [...wordBank];
    let selectedIdioms = [...idiomBank];

    if (isReviewMode) {
      selectedWords = selectedWords.filter(q => history[q.id] && history[q.id].isCorrect === false);
      selectedIdioms = selectedIdioms.filter(q => history[q.id] && history[q.id].isCorrect === false);
      displayQuestions = [...selectedWords, ...selectedIdioms].map(q => shuffleOptions(q));
    } else {
      const pickedWords = getRandomItems(selectedWords, 10);
      const pickedIdioms = getRandomItems(selectedIdioms, 5);
      displayQuestions = [...pickedWords, ...pickedIdioms].map(q => shuffleOptions(q));
    }

  } else if (currentSection === 'part2') {
    let baseQuestions = rawData.part2 || [];
    if (isReviewMode) {
      baseQuestions = baseQuestions.filter(q => history[q.id] && history[q.id].isCorrect === false);
    }
    baseQuestions = getRandomItems(baseQuestions, 5);
    displayQuestions = baseQuestions.map(q => shuffleOptions(q));

  } else {
    // 大問3・4
    let passages = rawData[currentSection] || [];
    passages = passages.map(p => {
      let filteredQs = p.questions;
      if (isReviewMode) {
        filteredQs = filteredQs.filter(q => history[q.id] && history[q.id].isCorrect === false);
      }
      return {
        ...p,
        questions: filteredQs.map(q => shuffleOptions(q))
      };
    }).filter(p => p.questions.length > 0);
    displayQuestions = getRandomItems(passages, 2);
  }

  renderUI();
}

function renderUI() {
  const history = loadHistory();
  const container = document.getElementById('questions-container');
  const modeIndicator = document.getElementById('mode-indicator');
  const reviewBtn = document.getElementById('review-btn');

  if (isReviewMode) {
    modeIndicator.textContent = '復習モード（誤答のみ）';
    modeIndicator.style.background = '#fee2e2';
    modeIndicator.style.color = '#991b1b';
    reviewBtn.textContent = '通常モードに戻る';
  } else {
    modeIndicator.textContent = '通常モード';
    modeIndicator.style.background = '#e0e7ff';
    modeIndicator.style.color = '#3730a3';
    reviewBtn.textContent = '復習モード';
  }

  // 統計計算
  let totalAnswered = 0;
  let totalCorrect = 0;
  let allPoolIds = [];

  if (currentSection === 'part1') {
    allPoolIds = [...wordBank, ...idiomBank].map(q => q.id);
  } else if (currentSection === 'part2') {
    allPoolIds = rawData.part2.map(q => q.id);
  } else {
    (rawData[currentSection] || []).forEach(p => p.questions.forEach(q => allPoolIds.push(q.id)));
  }

  allPoolIds.forEach(id => {
    if (history[id]) {
      totalAnswered++;
      if (history[id].isCorrect) totalCorrect++;
    }
  });

  const rate = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;
  document.getElementById('stats-display').textContent = `全体正答率: ${rate}% (${totalCorrect}/${totalAnswered} 済)`;

  if (displayQuestions.length === 0) {
    container.innerHTML = `<p style="text-align:center; padding: 30px 0; color: #64748b;">
      ${isReviewMode ? '復習する問題（間違えた問題）はありません！' : '該当する問題がありません。'}
    </p>`;
    return;
  }

  if (currentSection === 'part1' || currentSection === 'part2') {
    container.innerHTML = displayQuestions.map((q, index) => renderSingleQuestion(q, index + 1, history)).join('');
  } else {
    container.innerHTML = displayQuestions.map((p) => {
      return `
        <div class="passage-box">${p.passage}</div>
        ${p.questions.map((q, idx) => renderSingleQuestion(q, idx + 1, history)).join('')}
      `;
    }).join('');
  }
}

function renderSingleQuestion(q, indexNum, history) {
  const record = history[q.id];
  const isAnswered = record !== undefined;
  const isCorrect = record ? record.isCorrect : false;

  return `
    <div class="question-item">
      <div class="question-header">
        <span>問 ${indexNum}</span>
        ${q.tag ? `<span class="badge badge-tag">[${q.tag}]</span>` : ''}
        ${isAnswered ? `
          <span class="badge ${isCorrect ? 'badge-correct' : 'badge-incorrect'}">
            ${isCorrect ? '正解' : '不正解'}
          </span>
        ` : ''}
      </div>
      <div class="question-text">${q.question}</div>
      <div class="options">
        ${q.options.map((opt, optIdx) => {
          let classNames = 'option-btn';
          if (isAnswered) {
            if (optIdx === q.answer) classNames += ' selected-correct';
            else if (record.selected === optIdx && !isCorrect) classNames += ' selected-incorrect';
          }
          return `
            <button 
              class="${classNames}" 
              onclick="answerQuestion('${q.id}', ${optIdx},${q.answer})"
              ${isAnswered ? 'disabled' : ''}
            >
              ${optIdx + 1}.${opt}
            </button>
          `;
        }).join('')}
      </div>
      <div class="explanation ${isAnswered ? 'show' : ''}">
        ${q.explanation}
      </div>
    </div>
  `;
}

function answerQuestion(qId, selectedIdx, correctIdx) {
  const history = loadHistory();
  history[qId] = {
    selected: selectedIdx,
    isCorrect: selectedIdx === correctIdx,
    timestamp: new Date().getTime()
  };
  saveHistory(history);
  renderUI();
}

function shuffleCurrentSection() {
  loadSectionQuestions(true);
}

function toggleReviewMode() {
  isReviewMode = !isReviewMode;
  loadSectionQuestions(true);
}

function resetSectionData() {
  if (!confirm('このセクションの学習履歴をリセットしますか？')) return;
  const history = loadHistory();
  let idsToRemove = [];

  if (currentSection === 'part1') {
    idsToRemove = [...wordBank, ...idiomBank].map(q => q.id);
  } else if (currentSection === 'part2') {
    idsToRemove = rawData.part2.map(q => q.id);
  } else {
    (rawData[currentSection] || []).forEach(p => p.questions.forEach(q => idsToRemove.push(q.id)));
  }

  idsToRemove.forEach(id => delete history[id]);
  saveHistory(history);
  loadSectionQuestions(true);
}

window.addEventListener('DOMContentLoaded', () => {
  loadSectionQuestions(true);
});
