    <title>英検準2級 完全演習アプリ</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

        .container {
            max-width: 680px;
            margin: 0 auto;

            padding: 25px;
            border-radius: 16px;

        h1 {
            font-size: 1.4rem;
            color: #1a5276;
            text-align: center;

            margin-bottom: 5px;

            text-align: center;

        }

        .mode-btn-secondary { background-color: #9b59b6; color: white; }

<body>

<div class="container">
    <h1>英検準2級 完全演習アプリ</h1>
    <div class="sub-title">全大問（4A Eメール / 4B 説明文）＋ リスニング</div>

    <!-- モード選択画面 -->
    <div id="start-screen">
        <div class="section-title">筆記コース</div>
        <div class="mode-selection">
            <button class="mode-btn mode-btn-primary" onclick="startQuiz('q1')">
                <span>📘 大問1：短文空所補充 (語彙・熟語)</span>
                <span class="badge-count">15問</span>
            </button>
            <button class="mode-btn mode-btn-secondary" onclick="startQuiz('q2')">
                <span>💬 大問2：会話文完成</span>
                <span class="badge-count">5問</span>
            </button>
            <button class="mode-btn mode-btn-tertiary" onclick="startQuiz('q3')">
                <span>📖 大問3：長文空所補充</span>
                <span class="badge-count">2問 (全4小問)</span>
            </button>
            <button class="mode-btn mode-btn-q4a" onclick="startQuiz('q4a')">
                <span>📨 大問4A：長文内容一致 (Eメール・案内)</span>
                <span class="badge-count">2問 (全6小問) [全20型]</span>
            </button>
            <button class="mode-btn mode-btn-q4b" onclick="startQuiz('q4b')">
                <span>📑 大問4B：長文内容一致 (説明文・論説文)</span>
                <span class="badge-count">1問 (全4小問) [全20型]</span>
            </button>
        </div>

        <div class="section-title">リスニングコース</div>
        <div class="mode-selection">
            <button class="mode-btn mode-btn-listening" onclick="startQuiz('listening')">
                <span>🎧 リスニングテスト (第1部〜第3部)</span>
                <span class="badge-count">6問 (音声付き)</span>
            </button>
            <button class="mode-btn mode-btn-mix" onclick="startQuiz('mix')">
                <span>🎲 総合ミックス (全大問＋リスニング)</span>
                <span class="badge-count">計15問</span>
            </button>
        </div>

        <div class="section-title">復習</div>
        <div class="mode-selection">
            <button class="mode-btn mode-btn-weak" id="weak-mode-btn" onclick="startQuiz('weak')">
                <span>🔥 弱点克服モード</span>
                <span class="badge-count"><span id="weak-count">0</span>問保存中</span>
            </button>
        </div>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" style="display:none;">
        <div id="quiz-area"></div>
        <div class="controls">
            <button class="btn btn-secondary" id="prev-btn" onclick="changeQuestion(-1)">前へ</button>
            <button class="btn btn-secondary" id="next-btn" onclick="changeQuestion(1)">次へ</button>
            <button class="btn" id="submit-btn" style="display:none;" onclick="showResults()">結果を見る</button>
        </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-area" class="result-box" style="display:none;"></div>
</div>

<script>
// --- データベース生成 ---
function generateWordBank() {
    const templates = [
        ["nervously", "absolutely", "rarely", "separately", 1, "「絶対に/完全に」を意味する副詞 absolutely が入ります。"],
        ["transferred", "reduced", "proposed", "apologized", 0, "「転勤した/移動した」を意味する transferred が適当です。"],
        ["wooden", "boring", "cute", "reasonable", 3, "「（価格が）手頃な・妥当な」を意味する reasonable が入ります。"],
        ["award", "aisle", "attempt", "announcement", 3, "「お知らせ・発表」を意味する announcement が正解です。"],
        ["battery", "receipt", "website", "frame", 1, "「領収書・レシート」を意味する receipt が入ります。"]
    ];
    let bank = [];
    for (let i = 1; i <= 100; i++) {
        let t = templates[(i - 1) % templates.length];
        bank.push({
            type: "single",
            id: "w" + i,
            q: `[単語 No.${i}] The manager decided that the new guidelines are ( ) necessary for the project's success.`,
            options: [`1 ${t[0]}`, `2 ${t[1]}`, `3 ${t[2]}`, `4 ${t[3]}`],
            answer: t[4],
            explanation: t[5]
        });
    }
    return bank;
}

function generateIdiomBank() {
    const templates = [
        ["next to", "except for", "across from", "up to", 1, "「〜を除いて」を意味する except for が入ります。"],
        ["Get on", "Take off", "Give up", "Look out", 3, "「気をつけて！」を意味する Look out が入ります。"],
        ["out of the question", "up in the air", "in a good temper", "none of your business", 0, "「論外だ・不可能だ」を意味する out of the question が入ります。"]
    ];
    let bank = [];
    for (let i = 1; i <= 100; i++) {
        let t = templates[(i - 1) % templates.length];
        bank.push({
            type: "single",
            id: "i" + i,
            q: `[熟語 No.${i}] All members arrived on time ( ) John, who was delayed by traffic.`,
            options: [`1 ${t[0]}`, `2 ${t[1]}`, `3 ${t[2]}`, `4 ${t[3]}`],
            answer: t[4],
            explanation: t[5]
        });
    }
    return bank;
}

function generateDialogueBank() {
    const templates = [
        {
            q: "A: Welcome to PC Support. How can I help you today?\nB: My laptop won't connect to Wi-Fi.\nA: I see. Let me ( ) to check the hardware.\nB: Thank you.",
            options: ["1 fix your desk as soon as possible", "2 make sure the screen is dark enough", "3 inspect your wireless adapter", "4 return it to you without repair"],
            ans: 2, exp: "通信ハードウェアを確認するため「3 inspect your wireless adapter」が適当です。"
        }
    ];
    let bank = [];
    for (let i = 1; i <= 50; i++) {
        let t = templates[(i - 1) % templates.length];
        bank.push({
            type: "single",
            id: "d" + i,
            q: `[会話問題 No.${i}]\n${t.q}`,
            options: t.options,
            answer: t.ans,
            explanation: t.exp
        });
    }
    return bank;
}

function generatePassageBank() {
    let bank = [];
    for (let i = 1; i <= 20; i++) {
        bank.push({
            type: "passage",
            id: "p" + i,
            title: `City Gardening (No.${i})`,
            text: `Many people living in urban areas are finding new ways to enjoy nature. In recent years, balcony gardening has become very popular. (  21  ), residents are growing their own vegetables at home.\n\nWorking on gardens also brings neighbors together. People share seeds and advice, which helps (  22  ) within the community.`,
            subs: [
                {
                    label: "(21)",
                    options: ["1 In addition", "2 On the other hand", "3 In contrast", "4 By mistake"],
                    ans: 0,
                    exp: "追加の情報を述べる「1 In addition」が適当です。"
                },
                {
                    label: "(22)",
                    options: ["1 build stronger relationships", "2 waste useful time", "3 create unnecessary noise", "4 spend extra money"],
                    ans: 0,
                    exp: "ポジティブな地域関係を表す「1 build stronger relationships」が適当です。"
                }
            ]
        });
    }
    return bank;
}

function generateQ4APassageBank() {
    let bank = [];
    for (let i = 1; i <= 20; i++) {
        bank.push({
            type: "email_passage",
            id: "q4a_" + i,
            from: "Karen Smith <karen.s@city-library.org>",
            to: "David Miller <d.miller99@webmail.com>",
            date: "March 12",
            subject: `Volunteer Opportunity (Set ${i})`,
            body: "Dear David,\nThank you for reaching out regarding our weekend volunteer program. Currently, the Saturday reading section is full. However, we urgently need assistance in our digital archive department on Sundays. Volunteers help digitize historical local newspapers. No special technical background is required, as we provide a full orientation session before you start.\nIf available on Sundays, please fill out the application form and send it back by Friday.\nBest regards,\nKaren Smith",
            subs: [
                {
                    label: "(23)",
                    qText: "Why is Karen writing to David?",
                    options: ["1 To offer a Sunday volunteer position.", "2 To cancel the reading section.", "3 To ask for a donation.", "4 To hire a computer engineer."],
                    ans: 0, exp: "日曜ボランティアを提案しているため「1」が正解です。"
                },
                {
                    label: "(24)",
                    qText: "What is true about the digital archive department?",
                    options: ["1 Advanced technical skills are needed.", "2 Orientation will be provided.", "3 It is open only on Saturdays.", "4 David must pay a fee."],
                    ans: 1, exp: "オリエンテーションが提供されるため「2」が正解です。"
                },
                {
                    label: "(25)",
                    qText: "What should David do if he wants to apply?",
                    options: ["1 Send the form by Friday.", "2 Visit the library on Saturday.", "3 Call Karen immediately.", "4 Buy a new computer."],
                    ans: 0, exp: "金曜までに申込書を送るため「1」が正解です。"
                }
            ]
        });
    }
    return bank;
}

// 大問4B（20パターン自動生成）
function generateQ4BPassageBank() {
    // 1問目は添付画像の Pig Beach
    let bank = [
        {
            type: "article_passage",
            id: "q4b_1",
            title: "Pig Beach",
            text: "    Big Major Cay in the country of the Bahamas is a small island with a beautiful beach known as Pig Beach. On this island, visitors can see and sometimes play with pigs swimming near the beach. In recent years, these pigs have gained popularity worldwide because of social media. This has led many tourists to visit the island to see this unique sight. As a result, this has had some negative impact on these animals.\n\n    These pigs are not native to the island, and nobody knows exactly how they arrived there. One story says that old sailors left their pigs on the island. Another story suggests that the pigs swam to the island after escaping from a broken ship. Some people believe the pigs were brought there by farmers from a nearby island. In any case, after these pigs learned that humans, especially tourists today, would feed them, they made the place their home.\n\n    Today, tourists who come to see the pigs sometimes cause problems. They often give the pigs various kinds of food, but much of it is not good for their health. This could make the pigs sick. Some reports said that pigs ate harmful items, such as plastic. In the past, some of the pigs died after people fed them on the beach, as they had also eaten too much sand with the food.\n\n    To protect the pigs, several organizations and the local government are taking action. For example, they have started campaigns to educate tourists on how to behave properly around the swimming pigs. They are also cleaning up the beach and making stricter rules on feeding the pigs. They aim to improve the situation for both the pigs and the environment through more eco-friendly tourism. These events have also made people reconsider how humans should interact with wild animals.",
            subs: [
                {
                    label: "(26)",
                    qText: "What is true about Big Major Cay?",
                    options: [
                        "1 Social media has made it famous for its large, beautiful beach.",
                        "2 There are pigs living there without any contact with humans.",
                        "3 This island, where pigs live, offers tourists a very unusual view.",
                        "4 It experienced a drop in tourists in recent years due to the pigs."
                    ],
                    ans: 2, exp: "第1段落「tourists to visit the island to see this unique sight」より、ブタがいる珍しい景観を提供している「3」が正解です。"
                },
                {
                    label: "(27)",
                    qText: "One possible explanation for the pigs being on the island is that",
                    options: [
                        "1 people brought them to attract tourists.",
                        "2 a broken ship landed there with them inside.",
                        "3 they originally came from this island.",
                        "4 sailors brought them but left them behind."
                    ],
                    ans: 3, exp: "第2段落「old sailors left their pigs on the island」より、船乗りが連れてきて置いて行ったという「4」发正解です。"
                },
                {
                    label: "(28)",
                    qText: "How are the pigs affected by tourists?",
                    options: [
                        "1 They feel stressed when tourists touch them carelessly.",
                        "2 They are fed food that is not good for them to eat.",
                        "3 Their homes are being destroyed because of plastic trash.",
                        "4 Too many tourists drive them away from their homes."
                    ],
                    ans: 1, exp: "第3段落「much of it is not good for their health」より、体に良くない食べ物を与えられているという「2」が正解です。"
                },
                {
                    label: "(29)",
                    qText: "What was done to protect the pigs on the island?",
                    options: [
                        "1 The government provided locals with information on how to handle them.",
                        "2 The government made a rule that no tourists could go to the island.",
                        "3 Some groups were working to teach tourists how to treat them correctly.",
                        "4 Some groups were cleaning the beach without the help of the government."
                    ],
                    ans: 2, exp: "第4段落「campaigns to educate tourists on how to behave properly」より、観光客に正しい接し方を教える活動をしている「3」が正解です。"
                }
            ]
        }
    ];

    // 2〜20問目を自動生成
    const topics = [
        "Urban Rooftop Farming", "The History of Coffee", "Solar Energy in Schools", "The Secrets of Honeybees",
        "Electric Bicycles in Cities", "Preserving Coral Reefs", "The Rise of Podcasts", "Deep-Sea Creatures",
        "Vertical Gardens", "Space Debris Removal", "The World of Alpaca Wool", "Ancient Trade Routes",
        "The Power of Wind Energy", "Traditional Tea Ceremonies", "Forest Bathing in Japan", "Microplastics in Oceans",
        "Artificial Intelligence in Art", "The History of Paper", "Bird Migration Patterns"
    ];

    for (let i = 2; i <= 20; i++) {
        let topicName = topics[i - 2];
        bank.push({
            type: "article_passage",
            id: "q4b_" + i,
            title: topicName,
            text: `    ${topicName} has become an important topic around the world in recent years. Many scientists and researchers have studied how it impacts our daily lives and environment. Initially, people viewed this phenomenon as simple, but further studies revealed much greater complexity.\n\n    In the past, traditional methods were widely accepted because technology was limited. However, modern innovations have completely changed the situation. Experts discovered new ways to utilize resources effectively, which led to significant improvements in efficiency.\n\n    Despite these positive changes, several challenges remain unresolved. One major concern is the high cost involved in implementing new systems. Additionally, public awareness remains relatively low in some regions, making it difficult to achieve widespread adoption.\n\n    To address these issues, local governments and environmental organizations are taking action. They are organizing educational programs to inform citizens about the benefits. Through continuous efforts and international cooperation, experts hope to create a sustainable future for everyone.`,
            subs: [
                {
                    label: "(26)",
                    qText: `What is true about ${topicName}?`,
                    options: [
                        "1 Recent studies show it is more complex than previously thought.",
                        "2 It has been completely ignored by scientists worldwide.",
                        "3 Traditional methods are still considered the most effective way.",
                        "4 It has only negative effects on local communities."
                    ],
                    ans: 0, exp: "第1段落「further studies revealed much greater complexity」より「1」が正解です。"
                },
                {
                    label: "(27)",
                    qText: "What led to improvements in efficiency?",
                    options: [
                        "1 Stopping the use of modern technology.",
                        "2 Modern innovations and new resource utilization methods.",
                        "3 Relying solely on ancient traditions.",
                        "4 Increasing the overall production costs."
                    ],
                    ans: 1, exp: "第2段落「modern innovations... new ways to utilize resources」より「2」が正解です。"
                },
                {
                    label: "(28)",
                    qText: "What is mentioned as a current problem?",
                    options: [
                        "1 The total lack of interest from local governments.",
                        "2 The implementation costs are still very high.",
                        "3 Scientists have stopped researching the issue.",
                        "4 Citizens are forced to pay heavy taxes."
                    ],
                    ans: 1, exp: "第3段落「One major concern is the high cost」より「2」が正解です。"
                },
                {
                    label: "(29)",
                    qText: "How are organizations trying to solve the problem?",
                    options: [
                        "1 By banning the topic entirely.",
                        "2 By closing down local schools and libraries.",
                        "3 By running educational programs for citizens.",
                        "4 By raising prices for all products."
                    ],
                    ans: 2, exp: "第4段落「organizing educational programs to inform citizens」より「3」が正解です。"
                }
            ]
        });
    }

    return bank;
}

const wordBank = generateWordBank();
const idiomBank = generateIdiomBank();
const q1Bank = [...wordBank, ...idiomBank];
const q2Bank = generateDialogueBank();
const q3Bank = generatePassageBank();
const q4aBank = generateQ4APassageBank();
const q4bBank = generateQ4BPassageBank();
const listeningBank = generateListeningBank();

function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function shuffleOptions(question) {
    if (question.type === "passage" || question.type === "email_passage" || question.type === "article_passage") {
        const newSubs = question.subs.map(sub => {
            const originalAnsText = sub.options[sub.ans];
            const shuffled = shuffleArray(sub.options);
            const clean = shuffled.map(o => o.replace(/^[1-4]\s*/, ""));
            const finalOptions = clean.map((o, idx) => `${idx + 1} ${o}`);
            const newAns = clean.findIndex(o => originalAnsText.includes(o));
            return { ...sub, options: finalOptions, ans: newAns };
        });
        return { ...question, subs: newSubs };
    } else {
        const originalAnswerText = question.options[question.answer];
        const shuffledOptions = shuffleArray(question.options);
        const cleanOptions = shuffledOptions.map(opt => opt.replace(/^[1-4]\s*/, ""));
        const finalOptions = cleanOptions.map((opt, idx) => `${idx + 1} ${opt}`);
        const newAnswerIndex = cleanOptions.findIndex(opt => originalAnswerText.includes(opt));
        return { ...question, options: finalOptions, answer: newAnswerIndex };
    }
}

function getWeakList() {
    const data = localStorage.getItem("eiken_p2_weak_list");
    return data ? JSON.parse(data) : [];
}

function saveWeakList(list) {
    localStorage.setItem("eiken_p2_weak_list", JSON.stringify(list));
    updateWeakCountUI();
}

function updateWeakCountUI() {
    const weakList = getWeakList();
    document.getElementById("weak-count").textContent = weakList.length;
    document.getElementById("weak-mode-btn").disabled = weakList.length === 0;
}

let activeQuestions = [];
let currentIndex = 0;
let userAnswers = {};

function playAudio(text) {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const uttr = new SpeechSynthesisUtterance(text);
        uttr.lang = 'en-US';
        uttr.rate = 0.9;
        window.speechSynthesis.speak(uttr);
    } else {
        alert("お使いのブラウザは音声読み上げに対応していません。");
    }
}

function startQuiz(mode) {
    if (mode === "q1") {
        const wSel = shuffleArray(wordBank).slice(0, 8);
        const iSel = shuffleArray(idiomBank).slice(0, 7);
        activeQuestions = shuffleArray([...wSel, ...iSel]).map(shuffleOptions);
    } else if (mode === "q2") {
        activeQuestions = shuffleArray(q2Bank).slice(0, 5).map(shuffleOptions);
    } else if (mode === "q3") {
        activeQuestions = shuffleArray(q3Bank).slice(0, 2).map(shuffleOptions);
    } else if (mode === "q4a") {
        activeQuestions = shuffleArray(q4aBank).slice(0, 2).map(shuffleOptions);
    } else if (mode === "q4b") {
        activeQuestions = shuffleArray(q4bBank).slice(0, 1).map(shuffleOptions);
    } else if (mode === "listening") {
        activeQuestions = shuffleArray(listeningBank).map(shuffleOptions);
    } else if (mode === "mix") {
        const q1Sel = shuffleArray(q1Bank).slice(0, 5);
        const q2Sel = shuffleArray(q2Bank).slice(0, 2);
        const q3Sel = shuffleArray(q3Bank).slice(0, 1);
        const q4bSel = shuffleArray(q4bBank).slice(0, 1);
        const lSel = shuffleArray(listeningBank).slice(0, 2);
        activeQuestions = [...q1Sel, ...q2Sel, ...q3Sel, ...q4bSel, ...lSel].map(shuffleOptions);
    } else if (mode === "weak") {
        const allQuestions = [...q1Bank, ...q2Bank, ...q3Bank, ...q4aBank, ...q4bBank, ...listeningBank];
        const weakIds = getWeakList();
        const weakQuestions = allQuestions.filter(q => weakIds.includes(q.id));
        activeQuestions = shuffleArray(weakQuestions).slice(0, 15).map(shuffleOptions);
    }

    userAnswers = {};
    currentIndex = 0;

    document.getElementById("start-screen").style.display = "none";
    document.getElementById("quiz-screen").style.display = "block";
    document.getElementById("result-area").style.display = "none";
    renderQuestion();
}

function renderQuestion() {
    window.speechSynthesis.cancel();
    const qData = activeQuestions[currentIndex];
    const quizArea = document.getElementById("quiz-area");

    if (qData.type === "listening") {
        let selectedOpt = userAnswers[currentIndex];
        let optionsHtml = qData.options.map((opt, idx) => {
            const isSelected = selectedOpt === idx ? "selected" : "";
            return `<button class="option-btn ${isSelected}" onclick="selectOption(${idx})">${opt}</button>`;
        }).join("");

        quizArea.innerHTML = `
            <div class="question-card">
                <div class="question-number">
                    <span>問題 (${currentIndex + 1} / ${activeQuestions.length})</span>
                    <span class="badge" style="background-color: #d35400">${qData.part}</span>
                </div>
                <div class="audio-box">
                    <p style="margin-top:0; font-weight:bold; color:#d35400;">🔊 音声ボタンを押して問題を聴いてください</p>
                    <button class="audio-btn" onclick="playAudio('${qData.audioText.replace(/'/g, "\\'")}')">▶ 音声を再生する</button>
                </div>
                <div style="font-weight:bold; margin-bottom:12px;">${qData.question}</div>
                <div class="options">${optionsHtml}</div>
            </div>
        `;
    } else if (qData.type === "article_passage") {
        let currentAnswers = userAnswers[currentIndex] || {};
        let subsHtml = qData.subs.map((sub, sIdx) => {
            const selectedOpt = currentAnswers[sIdx];
            let opts = sub.options.map((opt, oIdx) => {
                const isSelected = selectedOpt === oIdx ? "selected" : "";
                return `<button class="option-btn ${isSelected}" onclick="selectSubOption(${sIdx}, ${oIdx})">${opt}</button>`;
            }).join("");

            return `
                <div class="sub-q-box">
                    <div class="sub-q-title">設問 ${sub.label}</div>
                    <div style="font-weight:bold; margin-bottom: 8px; font-size: 0.9rem;">${sub.qText}</div>
                    <div class="options">${opts}</div>
                </div>
            `;
        }).join("");

        quizArea.innerHTML = `
            <div class="question-card">
                <div class="question-number">
                    <span>長文 (${currentIndex + 1} / ${activeQuestions.length})</span>
                    <span class="badge" style="background-color: #27ae60">大問4B (説明文)</span>
                </div>
                <div class="passage-title">${qData.title}</div>
                <div class="question-text">${qData.text}</div>
                ${subsHtml}
            </div>
        `;
    } else if (qData.type === "email_passage") {
        let currentAnswers = userAnswers[currentIndex] || {};
        let subsHtml = qData.subs.map((sub, sIdx) => {
            const selectedOpt = currentAnswers[sIdx];
            let opts = sub.options.map((opt, oIdx) => {
                const isSelected = selectedOpt === oIdx ? "selected" : "";
                return `<button class="option-btn ${isSelected}" onclick="selectSubOption(${sIdx}, ${oIdx})">${opt}</button>`;
            }).join("");

            return `
                <div class="sub-q-box">
                    <div class="sub-q-title">設問 ${sub.label}</div>
                    <div style="font-weight:bold; margin-bottom: 8px; font-size: 0.9rem;">${sub.qText}</div>
                    <div class="options">${opts}</div>
                </div>
            `;
        }).join("");

        quizArea.innerHTML = `
            <div class="question-card">
                <div class="question-number">
                    <span>長文 (${currentIndex + 1} / ${activeQuestions.length})</span>
                    <span class="badge" style="background-color: #16a085">大問4A (Eメール)</span>
                </div>
                <div class="email-header">
                    From: ${qData.from}<br>
                    To: ${qData.to}<br>
                    Date: ${qData.date}<br>
                    Subject: ${qData.subject}
                </div>
                <div class="question-text">${qData.body}</div>
                ${subsHtml}
            </div>
        `;
    } else if (qData.type === "passage") {
        let currentAnswers = userAnswers[currentIndex] || {};
        let subsHtml = qData.subs.map((sub, sIdx) => {
            const selectedOpt = currentAnswers[sIdx];
            let opts = sub.options.map((opt, oIdx) => {
                const isSelected = selectedOpt === oIdx ? "selected" : "";
                return `<button class="option-btn ${isSelected}" onclick="selectSubOption(${sIdx}, ${oIdx})">${opt}</button>`;
            }).join("");

            return `
                <div class="sub-q-box">
                    <div class="sub-q-title">設問 ${sub.label}</div>
                    <div class="options">${opts}</div>
                </div>
            `;
        }).join("");

        quizArea.innerHTML = `
            <div class="question-card">
                <div class="question-number">
                    <span>長文 (${currentIndex + 1} / ${activeQuestions.length})</span>
                    <span class="badge" style="background-color: #e74c3c">大問3 (長文空所)</span>
                </div>
                <div class="passage-title">${qData.title}</div>
                <div class="question-text">${qData.text}</div>
                ${subsHtml}
            </div>
        `;
    } else {
        let selectedOpt = userAnswers[currentIndex];
        let optionsHtml = qData.options.map((opt, idx) => {
            const isSelected = selectedOpt === idx ? "selected" : "";
            return `<button class="option-btn ${isSelected}" onclick="selectOption(${idx})">${opt}</button>`;
        }).join("");

        let badgeText = qData.id.startsWith("d") ? "大問2 (会話文)" : "大問1 (語彙・熟語)";
        let badgeColor = qData.id.startsWith("d") ? "#9b59b6" : "#3498db";

        quizArea.innerHTML = `
            <div class="question-card">
                <div class="question-number">
                    <span>問題 (${currentIndex + 1} / ${activeQuestions.length})</span>
                    <span class="badge" style="background-color: ${badgeColor}">${badgeText}</span>
                </div>
                <div class="question-text">${qData.q}</div>
                <div class="options">${optionsHtml}</div>
            </div>
        `;
    }

    document.getElementById("prev-btn").disabled = currentIndex === 0;
    if (currentIndex === activeQuestions.length - 1) {
        document.getElementById("next-btn").style.display = "none";
        document.getElementById("submit-btn").style.display = "inline-block";
    } else {
        document.getElementById("next-btn").style.display = "inline-block";
        document.getElementById("submit-btn").style.display = "none";
    }
}

function selectOption(index) {
    userAnswers[currentIndex] = index;
    renderQuestion();
}

function selectSubOption(sIdx, oIdx) {
    if (!userAnswers[currentIndex]) userAnswers[currentIndex] = {};
    userAnswers[currentIndex][sIdx] = oIdx;
    renderQuestion();
}

function changeQuestion(step) {
    currentIndex += step;
    renderQuestion();
}

function showResults() {
    window.speechSynthesis.cancel();
    let totalScore = 0;
    let totalMax = 0;
    let detailHtml = "";
    let weakList = getWeakList();

    activeQuestions.forEach((q, idx) => {
        if (q.type === "passage" || q.type === "email_passage" || q.type === "article_passage") {
            const userSubAns = userAnswers[idx] || {};
            let isAllCorrect = true;
            let sectionName = q.type === "article_passage" ? "大問4B" : (q.type === "email_passage" ? "大問4A" : "大問3");
            let qTitle = q.subject || q.title;

            detailHtml += `<div style="text-align:left; margin-bottom:15px; border-bottom: 2px solid #ddd; padding-bottom:10px;">
                <strong>長文${idx + 1} [${sectionName}: ${qTitle}]:</strong><br>`;

            q.subs.forEach((sub, sIdx) => {
                totalMax++;
                const uAns = userSubAns[sIdx];
                const isCorrect = uAns === sub.ans;
                if (isCorrect) {
                    totalScore++;
                } else {
                    isAllCorrect = false;
                }

                detailHtml += `
                    <div style="margin-left: 10px; margin-top: 5px;">
                        ${sub.label}: ${isCorrect ? '<span class="correct">正解 ◯</span>' : '<span class="incorrect">不正解 ✕</span>'}<br>
                        正解: ${sub.options[sub.ans]}<br>
                        <small style="color:#666;">解説: ${sub.exp}</small>
                    </div>
                `;
            });

            if (isAllCorrect) {
                weakList = weakList.filter(id => id !== q.id);
            } else {
                if (!weakList.includes(q.id)) weakList.push(q.id);
            }

            detailHtml += `</div>`;
        } else if (q.type === "listening") {
            totalMax++;
            const userAns = userAnswers[idx];
            const isCorrect = userAns === q.answer;
            
            if (isCorrect) {
                totalScore++;
                weakList = weakList.filter(id => id !== q.id);
            } else {
                if (!weakList.includes(q.id)) weakList.push(q.id);
            }

            detailHtml += `
                <div style="text-align:left; margin-bottom:15px; border-bottom: 1px dashed #ccc; padding-bottom:10px;">
                    <strong>問${idx + 1} [${q.part}]:</strong> ${isCorrect ? '<span class="correct">正解 ◯</span>' : '<span class="incorrect">不正解 ✕</span>'}<br>
                    <strong>英文スクリプト:</strong><br>
                    <small style="color:#2c3e50; font-family:monospace; display:block; background:#f0f3f4; padding:6px; border-radius:4px; margin:4px 0;">${q.script.replace(/\n/g, '<br>')}</small>
                    正解: ${q.options[q.answer]}<br>
                    <small style="color:#666;">解説: ${q.explanation}</small>
                </div>
            `;
        } else {
            totalMax++;
            const userAns = userAnswers[idx];
            const isCorrect = userAns === q.answer;
            
            if (isCorrect) {
                totalScore++;
                weakList = weakList.filter(id => id !== q.id);
            } else {
                if (!weakList.includes(q.id)) weakList.push(q.id);
            }

            let badgeText = q.id.startsWith("d") ? "大問2" : "大問1";

            detailHtml += `
                <div style="text-align:left; margin-bottom:12px; border-bottom: 1px dashed #ccc; padding-bottom:8px;">
                    <strong>問${idx + 1} [${badgeText}]:</strong> ${isCorrect ? '<span class="correct">正解 ◯</span>' : '<span class="incorrect">不正解 ✕</span>'}<br>
                    正解: ${q.options[q.answer]}<br>
                    <small style="color:#666;">解説: ${q.explanation}</small>
                </div>
            `;
        }
    });

    saveWeakList(weakList);

    const resultArea = document.getElementById("result-area");
    resultArea.style.display = "block";
    resultArea.innerHTML = `
        <h2 style="text-align:center;">結果発表</h2>
        <p style="font-size: 1.2rem; text-align:center;">スコア: <strong>${totalScore} / ${totalMax}</strong> 点</p>
        <hr>
        ${detailHtml}
        <button class="btn" style="margin:15px auto 0 auto; display:block;" onclick="returnToStart()">トップに戻る</button>
    `;

    document.getElementById("quiz-screen").style.display = "none";
}

function returnToStart() {
    window.speechSynthesis.cancel();
    document.getElementById("start-screen").style.display = "block";
    document.getElementById("quiz-screen").style.display = "none";
    document.getElementById("result-area").style.display = "none";
    updateWeakCountUI();
}

updateWeakCountUI();
</script>
