<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英検準2級 対策アプリ</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --success: #16a34a;
      --error: #dc2626;
      --warning: #d97706;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      line-height: 1.6;
      padding: 20px 10px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 8px;
    }

    nav {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .nav-btn {
      padding: 8px 16px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .nav-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border);
    }

    .stats {
      font-size: 0.95rem;
      font-weight: bold;
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .btn {
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }

    .btn-secondary { background: #64748b; color: white; }
    .btn-secondary:hover { background: #475569; }
    .btn-warning { background: var(--warning); color: white; }
    .btn-warning:hover { background: #b45309; }
    .btn-danger { background: var(--error); color: white; }
    .btn-danger:hover { background: #b91c1c; }

    .question-item {
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .question-header {
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      color: white;
    }
    .badge-correct { background: var(--success); }
    .badge-incorrect { background: var(--error); }

    .question-text {
      font-size: 1.05rem;
      margin-bottom: 12px;
      white-space: pre-line;
    }

    .options {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .option-btn {
      text-align: left;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f8fafc;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }

    .option-btn:hover:not(:disabled) {
      background: #e2e8f0;
    }

    .option-btn.selected-correct {
      background: #dcfce7;
      border-color: var(--success);
      color: var(--success);
      font-weight: bold;
    }

    .option-btn.selected-incorrect {
      background: #fee2e2;
      border-color: var(--error);
      color: var(--error);
      font-weight: bold;
    }

    .explanation {
      margin-top: 10px;
      padding: 12px;
      background: #f1f5f9;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
    }

    .explanation.show {
      display: block;
    }

    .mode-badge {
      display: inline-block;
      padding: 4px 8px;
      background: #e0e7ff;
      color: #3730a3;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>英検準2級 対策アプリ</h1>
  </header>

  <nav id="nav">
    <button class="nav-btn active" onclick="switchSection('part1')">大問1: 語彙</button>
    <button class="nav-btn" onclick="switchSection('part2')">大問2: 会話文</button>
    <button class="nav-btn" onclick="switchSection('part3')">大問3: 長文語句補充</button>
    <button class="nav-btn" onclick="switchSection('part4')">大問4: 長文読解</button>
  </nav>

  <main class="card">
    <div class="controls-bar">
      <div>
        <span id="mode-indicator" class="mode-badge">通常モード</span>
        <div class="stats" id="stats-display">正答率: -% (0/0)</div>
      </div>
      <div class="action-btns">
        <button class="btn btn-secondary" onclick="shuffleCurrentSection()">シャッフル出題</button>
        <button class="btn btn-warning" id="review-btn" onclick="toggleReviewMode()">復習モード</button>
        <button class="btn btn-danger" onclick="resetSectionData()">成績リセット</button>
      </div>
    </div>

    <div id="questions-container"></div>
  </main>
</div>

<script>
// --- サンプル問題データ ---
const rawData = {
  part1: [
    {
      id: "p1_1",
      question: "The company plans to ( ) a new product next month.",
      options: ["launch", "cancel", "forget", "borrow"],
      answer: 0,
      explanation: "【解説】launch（〜を売り出す、開始する）が文脈上最も適切です。\n訳：その会社は来月、新商品を売り出す予定です。"
    },
    {
      id: "p1_2",
      question: "She showed great ( ) when facing difficulty.",
      options: ["courage", "noise", "traffic", "patience"],
      answer: 0,
      explanation: "【解説】courage（勇気）が適切です。\n訳：彼女は困難に直面したとき、素晴らしい勇気を示しました。"
    }
  ],
  part2: [
    {
      id: "p2_1",
      question: "A: Excuse me, how can I get to the station?\nB: ( )\nA: Thank you so much!",
      options: [
        "Go straight and turn left at the corner.",
        "Yes, I would love to.",
        "It was very expensive.",
        "I am fine, thank you."
      ],
      answer: 0,
      explanation: "【解説】道順を尋ねられているため、具体的な案内を示す選択肢が正解です。"
    }
  ],
  part3: [
    {
      id: "p3_1",
      question: "Many people enjoy traveling because it provides an opportunity to experience different cultures. ( ), they can taste local food and meet new people.",
      options: ["For example", "However", "Otherwise", "Therefore"],
      answer: 0,
      explanation: "【解説】具体的な体験の例を挙げているため「For example（例えば）」が適切です。"
    }
  ],
  part4: [
    {
      id: "p4_1",
      question: "According to the passage, why did the community start the garden project?\n\nPassage: Last year, the town started a community garden project to help residents grow fresh vegetables and socialize with neighbors.",
      options: [
        "To help residents grow vegetables and socialize.",
        "To build a new shopping center.",
        "To reduce traffic jams in the town.",
        "To sell vegetables to other cities."
      ],
      answer: 0,
      explanation: "【解説】本文の「to help residents grow fresh vegetables and socialize with neighbors」と一致します。"
    }
  ]
};

// --- アプリの状態管理 ---
let currentSection = 'part1';
let isReviewMode = false;
let displayQuestions = [];

// LocalStorageのキー
const STORAGE_KEY = 'eiken_prep_history_v1';

// 学習履歴データのロード
function loadHistory() {
  const data = localStorage.getItem(STORAGE_KEY);
  return data ? JSON.parse(data) : {};
}

// 学習履歴データの保存
function saveHistory(history) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
}

// 配列シャッフル関数（Fisher-Yates）
function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// セクション切り替え
function switchSection(sectionKey) {
  currentSection = sectionKey;
  isReviewMode = false;
  
  // ナビゲーションの見た目更新
  document.querySelectorAll('.nav-btn').forEach((btn, idx) => {
    const keys = ['part1', 'part2', 'part3', 'part4'];
    btn.classList.toggle('active', keys[idx] === sectionKey);
  });

  loadSectionQuestions();
}

// 問題の読み込みと表示準備
function loadSectionQuestions(shouldShuffle = false) {
  const history = loadHistory();
  let baseQuestions = rawData[currentSection] || [];

  // 復習モードの判定・抽出
  if (isReviewMode) {
    baseQuestions = baseQuestions.filter(q => {
      const record = history[q.id];
      return record && record.isCorrect === false;
    });
  }

  // 質問と選択肢の処理
  displayQuestions = baseQuestions.map(q => {
    const questionObj = { ...q };
    if (shouldShuffle) {
      // 選択肢のシャッフル処理
      const optionsWithIndices = q.options.map((opt, idx) => ({ opt, isCorrect: idx === q.answer }));
      const shuffledOptions = shuffleArray(optionsWithIndices);
      
      questionObj.options = shuffledOptions.map(item => item.opt);
      questionObj.answer = shuffledOptions.findIndex(item => item.isCorrect);
    }
    return questionObj;
  });

  if (shouldShuffle) {
    displayQuestions = shuffleArray(displayQuestions);
  }

  renderUI();
}

// UIのレンダリング
function renderUI() {
  const history = loadHistory();
  const container = document.getElementById('questions-container');
  const modeIndicator = document.getElementById('mode-indicator');
  const reviewBtn = document.getElementById('review-btn');
  
  // モード表示
  if (isReviewMode) {
    modeIndicator.textContent = '復習モード（誤答のみ）';
    modeIndicator.style.background = '#fee2e2';
    modeIndicator.style.color = '#991b1b';
    reviewBtn.textContent = '通常モードに戻る';
  } else {
    modeIndicator.textContent = '通常モード';
    modeIndicator.style.background = '#e0e0ff';
    modeIndicator.style.color = '#3730a3';
    reviewBtn.textContent = '復習モード';
  }

  // 成績統計の算出（現セクションの全問題に対して）
  const sectionRawQuestions = rawData[currentSection] || [];
  let totalAnswered = 0;
  let totalCorrect = 0;

  sectionRawQuestions.forEach(q => {
    if (history[q.id]) {
      totalAnswered++;
      if (history[q.id].isCorrect) totalCorrect++;
    }
  });

  const rate = totalAnswered > 0 ? Math.round((totalCorrect / totalAnswered) * 100) : 0;
  document.getElementById('stats-display').textContent = `正答率: ${rate}% (${totalCorrect}/${totalAnswered} 済)`;

  // 問題一覧の描画
  if (displayQuestions.length === 0) {
    container.innerHTML = `<p style="text-align:center; padding: 20px 0; color: #64748b;">
      ${isReviewMode ? '復習する問題（間違えた問題）はありません！' : '問題がありません。'}
    </p>`;
    return;
  }

  container.innerHTML = displayQuestions.map((q, index) => {
    const record = history[q.id];
    const isAnswered = record !== undefined;
    const isCorrect = record ? record.isCorrect : false;

    return `
      <div class="question-item">
        <div class="question-header">
          <span>問 ${index + 1}</span>
          ${isAnswered ? `
            <span class="badge ${isCorrect ? 'badge-correct' : 'badge-incorrect'}">
              ${isCorrect ? '正解' : '不正解'}
            </span>
          ` : ''}
        </div>
        <div class="question-text">${q.question}</div>
        <div class="options">
          ${q.options.map((opt, optIdx) => {
            let classNames = 'option-btn';
            if (isAnswered) {
              if (optIdx === q.answer) classNames += ' selected-correct';
              else if (record.selected === optIdx && !isCorrect) classNames += ' selected-incorrect';
            }

            return `
              <button 
                class="${classNames}" 
                onclick="answerQuestion('${q.id}', ${optIdx},${q.answer})"
                ${isAnswered ? 'disabled' : ''}
              >
                ${optIdx + 1}.${opt}
              </button>
            `;
          }).join('')}
        </div>
        <div class="explanation ${isAnswered ? 'show' : ''}">
          ${q.explanation}
        </div>
      </div>
    `;
  }).join('');
}

// 解答処理
function answerQuestion(qId, selectedIdx, correctIdx) {
  const history = loadHistory();
  const isCorrect = selectedIdx === correctIdx;

  history[qId] = {
    selected: selectedIdx,
    isCorrect: isCorrect,
    timestamp: new Date().getTime()
  };

  saveHistory(history);
  renderUI();
}

// ランダム出題（シャッフル）
function shuffleCurrentSection() {
  loadSectionQuestions(true);
}

// 復習モードのトグル
function toggleReviewMode() {
  isReviewMode = !isReviewMode;
  loadSectionQuestions();
}

// 現在のセクションの成績リセット
function resetSectionData() {
  if (!confirm('このセクションの学習履歴をリセットしますか？')) return;

  const history = loadHistory();
  const sectionQuestions = rawData[currentSection] || [];
  
  sectionQuestions.forEach(q => {
    delete history[q.id];
  });

  saveHistory(history);
  loadSectionQuestions();
}

// 初期化
window.addEventListener('DOMContentLoaded', () => {
  loadSectionQuestions();
});
</script>
</body>
</html>
